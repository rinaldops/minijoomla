<!-- Generic copied release: replace only the same-site release base and web context. -->
<div data-minijoomla-site></div>
<script type="module">
  const releaseBase = '__RELEASE_BASE__';
  const entry = new URL(`${releaseBase.replace(/\/$/, '')}/host/host.js`, document.baseURI);
  if (entry.origin !== location.origin || /__[A-Z_]+__/.test(releaseBase)) throw new TypeError('Configure a release local do MINIJOOMLA.');
  await import(entry.href);
</script>
